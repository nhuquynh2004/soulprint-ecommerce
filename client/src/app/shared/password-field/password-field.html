<div class="sp-pw">
  <app-icon class="sp-pw__lock" name="lock" [size]="18" />
  <input
    class="form-control"
    [class.is-invalid]="invalid"
    [id]="inputId"
    [type]="visible() ? 'text' : 'password'"
    [value]="value"
    [placeholder]="placeholder"
    [attr.autocomplete]="autocomplete"
    [disabled]="disabled"
    (input)="onInput($any($event.target).value)"
    (blur)="onTouched()"
  />
  <button
    class="btn sp-pw__eye"
    type="button"
    (click)="visible.set(!visible())"
    [attr.aria-label]="visible() ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
    [attr.aria-pressed]="visible()"
  >
    <app-icon [name]="visible() ? 'eye-off' : 'eye'" [size]="20" />
  </button>
</div>
@if (showRules) {
  <div class="sp-pw__rules" aria-live="polite">
    @if (strength.level) {
      <div class="sp-pw__meter" [attr.data-level]="strength.level">
        <span></span><span></span><span></span>
      </div>
      <p class="sp-pw__strength">Độ mạnh: <strong>{{ strength.label }}</strong></p>
    }
    <ul>
      @for (r of rules; track r.key) {
        <li [class.is-ok]="passed(r)" [class.is-idle]="!value">
          <app-icon [name]="passed(r) ? 'check' : 'close'" [size]="14" />
          {{ r.label }}<span class="visually-hidden">: {{ passed(r) ? 'đạt' : 'chưa đạt' }}</span>
        </li>
      }
    </ul>
  </div>
}
