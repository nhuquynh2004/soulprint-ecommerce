<div class="sp-cal" role="group" [attr.aria-label]="label">
  <div class="sp-cal__head">
    <button type="button" class="sp-cal__nav" [disabled]="!canPrev()" (click)="shift(-1)" aria-label="Tháng trước"><app-icon name="chevron-left" [size]="18" /></button>
    <strong aria-live="polite">{{ title() }}</strong>
    <button type="button" class="sp-cal__nav" [disabled]="!canNext()" (click)="shift(1)" aria-label="Tháng sau"><app-icon name="chevron-right" [size]="18" /></button>
  </div>
  <div class="sp-cal__grid" role="grid">
    @for (d of ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN']; track d) {
      <span class="sp-cal__dow" role="columnheader">{{ d }}</span>
    }
    @for (c of cells(); track c.ymd) {
      @if (c.inMonth) {
        <button type="button" class="sp-cal__day" role="gridcell" [class.is-on]="c.on" [class.is-today]="c.today" [class.is-marked]="c.marked"
          [disabled]="c.off" [attr.aria-selected]="c.on" [attr.aria-label]="ariaOf(c)" (click)="pick(c)">
          {{ c.day }}
          @if (c.marked && !c.on) {
            <small>{{ markLabel }}</small>
          }
        </button>
      } @else {
        <span class="sp-cal__day is-empty" aria-hidden="true"></span>
      }
    }
  </div>
</div>
